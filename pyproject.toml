[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "pydantic>=2.13.4",
    "llm_sdk"
]

[[tool.mypy.overrides]]
module = "llm_sdk"
follow_imports = "skip"
ignore_missing_imports = true

[tool.uv.sources]
llm_sdk = { path = "llm_sdk" }

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]